[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
# Nota: definir PUBLIC_GOOGLE_SITE_VERIFICATION en el panel de Netlify
# (Site configuration → Environment variables) — ver .env.example.

# Los redirects viven en public/_redirects (se copia a dist/ y Netlify los aplica).
# Este archivo los duplica a propósito como fuente explícita: mantener ambos en sync.
# Las reglas de trailing slash (/servicios → /servicios/) y las de HTML no-cache
# (public/_headers) solo viven en public/_redirects y public/_headers.

# Path-based legacy 301s (also in public/_redirects)
[[redirects]]
  from = "/servicios.html"
  to = "/servicios/"
  status = 301
[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/contacto.html"
  to = "/contacto/"
  status = 301
[[redirects]]
  from = "/nosotros.html"
  to = "/nosotros/"
  status = 301
[[redirects]]
  from = "/preguntas.html"
  to = "/preguntas/"
  status = 301
[[redirects]]
  from = "/privacidad.html"
  to = "/privacidad/"
  status = 301
[[redirects]]
  from = "/terminos.html"
  to = "/terminos/"
  status = 301
[[redirects]]
  from = "/cookies.html"
  to = "/cookies/"
  status = 301
[[redirects]]
  from = "/mapa.html"
  to = "/sitios/"
  status = 301
[[redirects]]
  from = "/funza.html"
  to = "/funza/"
  status = 301
[[redirects]]
  from = "/mosquera.html"
  to = "/mosquera/"
  status = 301
[[redirects]]
  from = "/madrid.html"
  to = "/madrid/"
  status = 301
[[redirects]]
  from = "/facatativa.html"
  to = "/facatativa/"
  status = 301
[[redirects]]
  from = "/demos.html"
  to = "/portfolio/"
  status = 301

# Query-string SPA legacy: /?page=servicios.html → /servicios/
[[redirects]]
  from = "/"
